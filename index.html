<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeroSky</title>
    <meta
      name="description"
      content="Parametric weather cover for small farms and outdoor businesses, settled by GenLayer consensus."
    />
    <script>
      // Runs before paint so a saved "light" preference never flashes dark first.
      // ZeroSky's default (no saved preference) is dark, set directly in globals.css.
      try {
        var t = localStorage.getItem("zerosky.theme");
        if (t === "light") document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
